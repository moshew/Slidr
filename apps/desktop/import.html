<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slidr import</title>
    <!--
      The import window (SPEC 13.3): never shown. An imported file runs in a frame of this page
      and inherits this policy. No directive of it lets an address of the network through: the
      file loads what it carries (data:, blob:) and nothing else. Every directive, not only the
      ones a request falls under, because the browser lets a prefetch go when any directive
      would allow its address. The one address beside the page's own is the app's media
      library, for fonts alone: the built-in fonts of a packaged app are files of that folder
      on this machine, and a file may name one without carrying it. What the policy refuses,
      the browser reports to the page, and
      the page hands the list over for the import report. Behind the policy, Rust refuses
      every request of the window that is not this page or the IPC, and writes down what it
      refused: the two together are the block.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self' data: blob: 'unsafe-inline' 'unsafe-eval';
        style-src 'self' data: blob: 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self' data: blob: http://media.localhost;
        media-src data: blob:;
        frame-src data: blob:;
        worker-src data: blob:;
        object-src 'none';
        connect-src 'self' ipc: http://ipc.localhost data: blob:
      "
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/import/page/main.ts"></script>
  </body>
</html>
