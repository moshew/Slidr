[package]
name = "slidr"
version = "0.1.0"
description = "Slidr desktop presentation editor"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "slidr_lib"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# .slidr archives; deflate through the pure-Rust zlib-rs backend, nothing else.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Asset ids (content hashes).
sha2 = "0.10"
# Asset type from the content's magic bytes.
infer = "0.22"
# Image dimensions from the header only.
imagesize = { version = "0.15.0", default-features = false, features = ["bmp", "gif", "heif", "ico", "jpeg", "png", "tiff", "webp"] }
# Workspace ids and temp file names.
uuid = { version = "1", features = ["v4"] }
# The file name header of asset_import_bytes.
percent-encoding = "2"
# Agent harnesses: the CLI child process and its pipes, the session locks and turn state, the
# interrupt and close timeouts, select!. Already in the tree through Tauri, whose runtime it is.
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "fs", "net"] }
# `dyn AgentHarness` / `dyn AgentSession` with async methods; native async fn in traits is not
# dyn-compatible yet. Its proc-macro dependencies are already in the tree through serde.
async-trait = "0.1"
# The tool bridge (ADR-002, ADR-022): the protocol, as a Streamable HTTP server. No macros and no
# client; the tools are defined in the webview, not here.
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
# Serves the bridge on 127.0.0.1 and carries its auth layer. HTTP/1 only, no extractors.
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
# API keys in the credential store of the operating system (SEC-04, ADR-051): the Windows
# Credential Manager, the macOS Keychain, the Secret Service on Linux.
keyring = "4.2"
# HTTPS for what is a web API (ADR-051): images made with the user's key, stock photos.
# TLS is the operating system's (SChannel on Windows), so no TLS library is built; HTTP/1 only.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "multipart", "query", "system-proxy"] }
# Decodes, scales and encodes pictures for an edit that keeps the pixels outside its mask (ADR-051).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# The pictures an image API returns inside JSON; and, on Windows, the PNG of a slide capture.
base64 = "0.22"
# Runs the matting model of local background removal (GEN-06) in this process and in Rust: no
# native library, and nothing downloaded at build time. Without the transformer operators,
# which a convolutional model does not use.
tract-onnx = { version = "0.23.8", default-features = false }
# The kernels of the same library, named only to turn on their thread pool: a model that reads
# 1024 pixels a side takes 2 s on eight threads and 6 s on one.
tract-linalg = { version = "0.23.8", features = ["multithread-mm"] }

# Slide capture (ADR-003): Page.captureScreenshot through the WebView2 DevTools protocol. The
# versions wry already uses, so nothing new is built.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# The installed fonts (SPEC appendix B): DirectWrite's system font collection. The crate and the
# version Tauri already builds, with one more of its features.
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }

[dev-dependencies]
tempfile = "3.27.0"
# Paused virtual time, so the mock harness's scripted delays run instantly and deterministically.
tokio = { version = "1", features = ["test-util"] }
