<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Slidr mark (src/shell/SlidrMark.tsx) on a tile of the header's gradient: a slide
       stepping forward from the one behind it, with a spark breaking out of its corner. -->
  <defs>
    <linearGradient id="tile" x1="64" y1="64" x2="960" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087e8b"/>
      <stop offset="0.55" stop-color="#4c50c8"/>
      <stop offset="1" stop-color="#8534d5"/>
    </linearGradient>
    <path id="spark" d="M25.5 5.5Q26.38 10.12 31 11Q26.38 11.88 25.5 16.5Q24.62 11.88 20 11Q24.62 10.12 25.5 5.5Z"/>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <use href="#spark" fill="#000" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <g transform="translate(160 160) scale(22)">
    <g mask="url(#cut)">
      <rect x="3" y="6" width="18" height="13" rx="2.5" fill="#fff" fill-opacity="0.5"/>
      <rect x="7" y="12" width="20" height="14" rx="3" fill="#fff"/>
      <rect x="10" y="16" width="9" height="2.5" rx="1.25" fill="#4c50c8"/>
      <rect x="10" y="20.5" width="6" height="2" rx="1" fill="#4c50c8" fill-opacity="0.45"/>
    </g>
    <use href="#spark" fill="#ffc94d"/>
  </g>
</svg>
