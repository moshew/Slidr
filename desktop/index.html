<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Give WebView2 the app's chrome colour before the bundled stylesheet loads. -->
    <style>
      html {
        background: #f4f4f6;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #161618;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The script nonce of this load (ADR-066): whoever serves the page writes it here and into
         the page's content policy. See src/scriptNonce.ts. -->
    <meta name="slidr-script-nonce" content="__TAURI_SCRIPT_NONCE__" />
    <title>Slidr</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
