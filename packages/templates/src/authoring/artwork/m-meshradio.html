<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- m-meshradio: a block of terrain cut out like a museum relief, a ridge between two valleys, a
     river and a village, with the radios of a rescue operation on it and the links of their mesh
     network drawn as lines of sight that hop over the ridge. Sun and sky light, soft shadows,
     transparent ground. Render: node render-art.mjs m-meshradio.html out.png 1200 900 2 -->
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
    <script>
      document.documentElement.dataset.wait = 'true';
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "/tmp/claude-0/-home-user-Slidr/47879b34-d1cb-5c54-8cd5-146df1bb4f61/scratchpad/lib/node_modules/three/build/three.module.js",
          "three/addons/": "/tmp/claude-0/-home-user-Slidr/47879b34-d1cb-5c54-8cd5-146df1bb4f61/scratchpad/lib/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

      const W = innerWidth,
        H = innerHeight;
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(W, H);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.35;
      scene.add(new THREE.HemisphereLight(0xdfeeff, 0x8a7a5a, 1.1));
      const sun = new THREE.DirectionalLight(0xfff1dc, 3.0);
      sun.position.set(-26, 30, 12);
      sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 4096);
      Object.assign(sun.shadow.camera, {
        left: -32,
        right: 32,
        top: 32,
        bottom: -32,
        near: 1,
        far: 120,
      });
      sun.shadow.bias = -0.0006;
      sun.shadow.normalBias = 0.02;
      scene.add(sun);

      // ---- noise -------------------------------------------------------------------------------------
      function hash2(x, y) {
        let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }
      function noise2(x, y) {
        const xi = Math.floor(x),
          yi = Math.floor(y),
          xf = x - xi,
          yf = y - yi;
        const u = xf * xf * (3 - 2 * xf),
          v = yf * yf * (3 - 2 * yf);
        const a = hash2(xi, yi),
          b = hash2(xi + 1, yi),
          c = hash2(xi, yi + 1),
          d = hash2(xi + 1, yi + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      const fbm = (x, y, o = 6) => {
        let s = 0,
          a = 0.5,
          f = 1,
          n = 0;
        for (let i = 0; i < o; i++) {
          s += a * noise2(x * f + i * 31.7, y * f - i * 17.1);
          n += a;
          a *= 0.5;
          f *= 2.02;
        }
        return s / n;
      };
      const ridged = (x, y, o = 5) => {
        let s = 0,
          a = 0.5,
          f = 1,
          n = 0;
        for (let i = 0; i < o; i++) {
          s += a * (1 - Math.abs(noise2(x * f + 9.3 * i, y * f) * 2 - 1)) ** 2;
          n += a;
          a *= 0.5;
          f *= 2.05;
        }
        return s / n;
      };

      // ---- the land ----------------------------------------------------------------------------------
      const S = 40,
        N = 420; // 40 x 40 units, N x N cells
      const riverX = (z) => -10.5 + Math.sin(z * 0.11 + 0.6) * 2.6 + z * 0.1;
      function height(x, z) {
        const wx = x + (fbm(x * 0.05, z * 0.05, 3) - 0.5) * 8,
          wz = z + (fbm(x * 0.05 + 7, z * 0.05, 3) - 0.5) * 8;
        // a ridge running across the block, higher toward the back right
        const ridgeLine = -0.5 + Math.sin(wz * 0.09) * 3 + wz * 0.05;
        const d = Math.abs(wx - ridgeLine);
        let h = 7.2 * Math.exp(-(d * d) / 40) * (0.65 + 0.5 * ridged(wx * 0.07, wz * 0.07));
        h += 2.2 * ridged(wx * 0.09 + 3, wz * 0.09) * Math.exp(-(d * d) / 160);
        h += (fbm(wx * 0.12, wz * 0.12, 5) - 0.5) * 1.6;
        h += Math.max(0, x - 11) * 0.18; // hills on the far side
        h += (fbm(x * 0.18 + 5, z * 0.18, 4) - 0.4) * 1.5; // rolling ground in the valleys
        const k = Math.min(1, Math.max(0, (h - 2.5) / 3.5));
        h += (ridged(x * 0.32 + 2, z * 0.32, 4) - 0.45) * 1.3 * k; // gullies on the high slopes
        const dr = Math.abs(x - riverX(z));
        h = h * (1 - 0.85 * Math.exp(-(dr * dr) / 18)) - 0.25 * Math.exp(-(dr * dr) / 1.2); // the river valley
        return Math.max(h, -0.2) + 0.6;
      }
      const terrain = new THREE.PlaneGeometry(S, S, N, N);
      terrain.rotateX(-Math.PI / 2);
      const pos = terrain.attributes.position;
      for (let i = 0; i < pos.count; i++) pos.setY(i, height(pos.getX(i), pos.getZ(i)));
      terrain.computeVertexNormals();
      const colors = new Float32Array(pos.count * 3);
      const nrm = terrain.attributes.normal;
      const C = (hex) => new THREE.Color(hex);
      const meadow = C(0x7f9450),
        field1 = C(0xa7ac62),
        field2 = C(0x6f8a45),
        scrub = C(0x8e8a55),
        slope = C(0xb59a6c),
        rock = C(0x8b8172),
        crest = C(0xd2c3a3),
        riverbank = C(0x5f7c45);
      const tmp = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i),
          y = pos.getY(i),
          z = pos.getZ(i);
        const steep = 1 - nrm.getY(i);
        const n = fbm(x * 0.4, z * 0.4, 3);
        tmp.copy(meadow).lerp(scrub, Math.min(1, Math.max(0, (y - 1.2) / 2.5)));
        // fields on the valley floor, in a patchwork
        if (y < 2.6 && steep < 0.12) {
          // fields: strips at an angle to the valley, with darker hedges between them
          const fx = x * 0.87 + z * 0.5,
            fz = -x * 0.5 + z * 0.87;
          const row = Math.floor((fz + 60) / 1.25);
          const along = (fx + 60) / (1.7 + hash2(row, 3) * 1.4) + hash2(row, 7) * 3;
          const cell = hash2(Math.floor(along), row);
          const pick = [field1, field2, C(0xc4ad6e), C(0x8fa35a), C(0x9c9a58), C(0xb5b277)][
            Math.floor(cell * 6)
          ];
          const fade = Math.min(1, Math.max(0, (2.6 - y) / 0.8));
          if (cell > 0.15) tmp.lerp(pick, 0.72 * fade);
          const ex = Math.min(along % 1, 1 - (along % 1)),
            ez = Math.min(((fz + 60) / 1.25) % 1, 1 - (((fz + 60) / 1.25) % 1));
          if (Math.min(ex * 1.7, ez * 1.25) < 0.05) tmp.lerp(C(0x4f6a35), 0.55 * fade);
        }
        tmp.lerp(slope, Math.min(1, Math.max(0, (y - 2.6) / 2.2)) * 0.9);
        tmp.lerp(rock, Math.min(1, Math.max(0, (steep - 0.18) / 0.25)));
        tmp.lerp(crest, Math.min(1, Math.max(0, (y - 7.2) / 1.6)) * 0.8);
        const dr = Math.abs(x - riverX(z));
        tmp.lerp(riverbank, Math.exp(-(dr * dr) / 3) * 0.6);
        tmp.multiplyScalar(0.88 + n * 0.24);
        colors.set([tmp.r, tmp.g, tmp.b], i * 3);
      }
      terrain.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const land = new THREE.Mesh(
        terrain,
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 }),
      );
      land.castShadow = land.receiveShadow = true;
      scene.add(land);

      // ---- the cut sides of the block: soil in layers ------------------------------------------------
      {
        const strata = (() => {
          const c = document.createElement('canvas');
          c.width = 64;
          c.height = 512;
          const g = c.getContext('2d');
          const bands = [
            '#6d5a43',
            '#7e6a4f',
            '#5f4e3a',
            '#8a7558',
            '#6a573f',
            '#7b6649',
            '#56463a',
          ];
          let y = 0,
            i = 0;
          while (y < 512) {
            const h = 22 + ((i * 37) % 41);
            g.fillStyle = bands[i % bands.length];
            g.fillRect(0, y, 64, h);
            y += h;
            i++;
          }
          const t = new THREE.CanvasTexture(c);
          t.colorSpace = THREE.SRGBColorSpace;
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          return t;
        })();
        const BASE = -3.2;
        const sideMat = new THREE.MeshStandardMaterial({ map: strata, roughness: 0.95 });
        const parts = [];
        const edge = (pts) => {
          const g = new THREE.BufferGeometry();
          const v = [],
            uv = [],
            idx = [];
          pts.forEach(([x, z], k) => {
            const top = height(x, z);
            v.push(x, top, z, x, BASE, z);
            uv.push((k / (pts.length - 1)) * 6, (top - BASE) / 12, (k / (pts.length - 1)) * 6, 0);
            if (k > 0) {
              const a = (k - 1) * 2;
              idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
            }
          });
          g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
          g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
          g.setIndex(idx);
          g.computeVertexNormals();
          parts.push(g);
        };
        const h = S / 2,
          line = (a, b) =>
            Array.from({ length: N + 1 }, (_, k) => [
              a[0] + ((b[0] - a[0]) * k) / N,
              a[1] + ((b[1] - a[1]) * k) / N,
            ]);
        edge(line([-h, h], [h, h]));
        edge(line([h, h], [h, -h]));
        edge(line([h, -h], [-h, -h]));
        edge(line([-h, -h], [-h, h]));
        const sides = new THREE.Mesh(mergeGeometries(parts), sideMat);
        sides.material.side = THREE.DoubleSide;
        sides.castShadow = sides.receiveShadow = true;
        scene.add(sides);
        const bottom = new THREE.Mesh(
          new THREE.BoxGeometry(S, 0.4, S),
          new THREE.MeshStandardMaterial({ color: 0x3d342b, roughness: 0.9 }),
        );
        bottom.position.y = BASE - 0.2;
        scene.add(bottom);
      }

      // ---- the river -----------------------------------------------------------------------------------
      {
        const pts = [];
        for (let z = -S / 2; z <= S / 2; z += 0.25) pts.push([riverX(z), z]);
        const g = new THREE.BufferGeometry();
        const v = [],
          idx = [];
        pts.forEach(([x, z], k) => {
          const w = 0.42 + 0.12 * Math.sin(z * 0.7);
          const y = Math.min(height(x - w, z), height(x, z), height(x + w, z)) + 0.05;
          v.push(x - w, y, z, x + w, y, z);
          if (k > 0) {
            const a = (k - 1) * 2;
            idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
          }
        });
        g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
        g.setIndex(idx);
        g.computeVertexNormals();
        const river = new THREE.Mesh(
          g,
          new THREE.MeshPhysicalMaterial({
            color: 0x4f8fb0,
            roughness: 0.12,
            metalness: 0.1,
            clearcoat: 1,
          }),
        );
        river.receiveShadow = true;
        scene.add(river);
      }

      // ---- a road along the valley and a village ---------------------------------------------------------
      {
        const roadX = (z) => riverX(z) + 2.3 + Math.sin(z * 0.2) * 0.6;
        const pts = [];
        for (let z = -S / 2 + 0.2; z <= S / 2 - 0.2; z += 0.3) {
          const x = roadX(z);
          pts.push(new THREE.Vector3(x, height(x, z) + 0.06, z));
        }
        const road = new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 400, 0.09, 6),
          new THREE.MeshStandardMaterial({ color: 0xe8e0cc, roughness: 0.8 }),
        );
        road.scale.y = 1;
        road.receiveShadow = true;
        scene.add(road);
        let seed = 11;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const houses = [];
        for (let i = 0; i < 34; i++) {
          const z = 6 + rnd() * 6,
            x = roadX(z) + (rnd() - 0.4) * 3.2;
          const w = 0.35 + rnd() * 0.3,
            d = 0.3 + rnd() * 0.25,
            hh = 0.25 + rnd() * 0.25;
          const g = new THREE.BoxGeometry(w, hh, d);
          g.rotateY(rnd() * 0.6);
          g.translate(x, height(x, z) + hh / 2, z);
          houses.push(g);
        }
        const village = new THREE.Mesh(
          mergeGeometries(houses),
          new THREE.MeshStandardMaterial({ color: 0xf3eee4, roughness: 0.7 }),
        );
        village.castShadow = village.receiveShadow = true;
        scene.add(village);
      }

      // ---- trees: little cones scattered in the valleys --------------------------------------------------
      {
        let seed = 3;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const cones = [];
        for (let i = 0; i < 4200; i++) {
          const x = -S / 2 + 1 + rnd() * (S - 2),
            z = -S / 2 + 1 + rnd() * (S - 2);
          const y = height(x, z);
          if (y > 5.2 || y < 0.75) continue;
          if (fbm(x * 0.14 + 40, z * 0.14, 3) < 0.53) continue; // in woods, not everywhere
          if (Math.abs(x - riverX(z)) < 0.9) continue;
          const s = 0.14 + rnd() * 0.14;
          const g = new THREE.ConeGeometry(s, s * 2.6, 7);
          g.translate(x, y + s * 1.2, z);
          cones.push(g);
        }
        const trees = new THREE.Mesh(
          mergeGeometries(cones),
          new THREE.MeshStandardMaterial({ color: 0x3f5a2e, roughness: 0.9 }),
        );
        trees.castShadow = trees.receiveShadow = true;
        scene.add(trees);
      }

      // ---- the radios and their links -----------------------------------------------------------------------
      const TEAL = 0x2563ff;
      const crestX = (z) => {
        let best = [-20, -1e9];
        for (let x = -10; x <= 14; x += 0.05) {
          const y = height(x, z);
          if (y > best[1]) best = [x, y];
        }
        return best[0];
      };
      const nodes = {
        base: [-6.0, 9.0, 0.6], // base camp by the village
        ridge: [crestX(-1.5), -1.5, 0.4], // a relay on the crest of the ridge
        team1: [12.5, -1.0, 0.45], // a team in the far valley, out of sight of the base
        team2: [-13.5, -12.0, 0.45], // a team up the near valley
        vehicle: [-9.6, 0.0, 0.4], // an ambulance on the road
        drone: [7.5, -11.0, 5.6], // a drone hovering as a relay
      };
      const where = {};
      for (const [name, [x, z, lift]] of Object.entries(nodes)) {
        const ground = height(x, z);
        const top = name === 'drone' ? ground + lift : ground + 2.0 + lift;
        where[name] = new THREE.Vector3(x, top, z);
        const glow = new THREE.MeshBasicMaterial({ color: 0xffffff });
        if (name !== 'drone') {
          // a mast
          const mast = new THREE.Mesh(
            new THREE.CylinderGeometry(0.05, 0.07, top - ground, 12),
            new THREE.MeshStandardMaterial({ color: 0xf6f4ef, roughness: 0.4 }),
          );
          mast.position.set(x, ground + (top - ground) / 2, z);
          mast.castShadow = true;
          scene.add(mast);
          const foot = new THREE.Mesh(
            new THREE.CylinderGeometry(0.32, 0.36, 0.08, 32),
            new THREE.MeshStandardMaterial({ color: 0xf6f4ef, roughness: 0.4 }),
          );
          foot.position.set(x, ground + 0.04, z);
          scene.add(foot);
        } else {
          // a small quadcopter
          const body = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.14, 0.5),
            new THREE.MeshStandardMaterial({ color: 0xf6f4ef, roughness: 0.4 }),
          );
          body.position.copy(where[name]).y -= 0.25;
          body.castShadow = true;
          scene.add(body);
          for (const [dx, dz] of [
            [1, 1],
            [1, -1],
            [-1, 1],
            [-1, -1],
          ]) {
            const arm = new THREE.Mesh(
              new THREE.CylinderGeometry(0.035, 0.035, 0.75, 8),
              new THREE.MeshStandardMaterial({ color: 0x2b2f33 }),
            );
            arm.rotation.z = Math.PI / 2;
            arm.rotation.y = Math.atan2(dz, dx) * -1;
            arm.position.set(
              where[name].x + dx * 0.25,
              where[name].y - 0.25,
              where[name].z + dz * 0.25,
            );
            scene.add(arm);
            const rotor = new THREE.Mesh(
              new THREE.CylinderGeometry(0.26, 0.26, 0.015, 32),
              new THREE.MeshStandardMaterial({ color: 0x9aa3ab, transparent: true, opacity: 0.55 }),
            );
            rotor.position.set(
              where[name].x + dx * 0.52,
              where[name].y - 0.17,
              where[name].z + dz * 0.52,
            );
            scene.add(rotor);
          }
        }
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 24), glow);
        head.renderOrder = 2;
        head.position.copy(where[name]);
        scene.add(head);
        const ring = new THREE.Mesh(
          new THREE.SphereGeometry(0.62, 32, 24),
          new THREE.MeshBasicMaterial({
            color: TEAL,
            transparent: true,
            opacity: 0.38,
            depthWrite: false,
            side: THREE.BackSide,
          }),
        );
        ring.position.copy(where[name]);
        scene.add(ring);
        const halo = new THREE.Mesh(
          new THREE.SphereGeometry(0.95, 32, 24),
          new THREE.MeshBasicMaterial({
            color: TEAL,
            transparent: true,
            opacity: 0.16,
            depthWrite: false,
          }),
        );
        halo.position.copy(where[name]);
        scene.add(halo);
      }
      const links = [
        ['base', 'vehicle'],
        ['base', 'ridge'],
        ['vehicle', 'team2'],
        ['vehicle', 'ridge'],
        ['ridge', 'team1'],
        ['ridge', 'drone'],
        ['drone', 'team1'],
        ['team2', 'drone'],
        ['team2', 'ridge'],
        ['base', 'drone'],
      ];
      // a link is drawn only where the two radios see each other over the ground
      const clear = (p, q) => {
        for (let t = 0.04; t < 0.96; t += 0.01) {
          const v = p.clone().lerp(q, t);
          if (height(v.x, v.z) > v.y - 0.15) return false;
        }
        return true;
      };
      for (const [a, b] of links) {
        const p = where[a],
          q = where[b];
        if (!clear(p, q)) {
          console.log('blocked', a, b);
          continue;
        }
        const curve = new THREE.LineCurve3(p, q);
        const core = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 2, 0.045, 12),
          new THREE.MeshBasicMaterial({ color: 0xffffff }),
        );
        scene.add(core);
        const glow = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 2, 0.11, 12),
          new THREE.MeshBasicMaterial({
            color: TEAL,
            transparent: true,
            opacity: 0.8,
            depthWrite: false,
          }),
        );
        scene.add(
          new THREE.Mesh(
            new THREE.TubeGeometry(curve, 2, 0.26, 12),
            new THREE.MeshBasicMaterial({
              color: TEAL,
              transparent: true,
              opacity: 0.14,
              depthWrite: false,
            }),
          ),
        );
        scene.add(glow);
        // packets on the way
        for (const t of [0.3, 0.68]) {
          const dot = new THREE.Mesh(
            new THREE.SphereGeometry(0.14, 16, 12),
            new THREE.MeshBasicMaterial({ color: 0xffffff }),
          );
          dot.position.lerpVectors(p, q, t);
          scene.add(dot);
        }
      }

      // ---- shadow catcher ------------------------------------------------------------------------------------
      {
        const c = document.createElement('canvas');
        c.width = c.height = 512;
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(256, 256, 60, 256, 256, 256);
        grad.addColorStop(0, 'rgba(40,36,30,0.45)');
        grad.addColorStop(0.9, 'rgba(40,36,30,0)');
        grad.addColorStop(1, 'rgba(40,36,30,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 512, 512);
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(S * 1.5, S * 1.5),
          new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(c),
            transparent: true,
            depthWrite: false,
          }),
        );
        m.rotation.x = -Math.PI / 2;
        m.position.y = -3.62;
        scene.add(m);
      }

      const camera = new THREE.PerspectiveCamera(22, W / H, 1, 400);
      camera.position.set(-66, 74, 74);
      camera.lookAt(0, -1.6, 0);
      renderer.render(scene, camera);
      const pr = (v) => {
        const q = v.clone().project(camera);
        return [Math.round(((q.x + 1) / 2) * W), Math.round(((1 - q.y) / 2) * H)];
      };
      for (const k of Object.keys(where)) console.log(k, pr(where[k]));
      document.documentElement.dataset.ready = 'true';
    </script>
  </body>
</html>
