<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- The macro shot of the Shvav sample (textImage): the meter's board up close, the
     microcontroller in focus. Render: render-art.mjs shvav-board.html out.png 700 800 2 -->
<link rel="stylesheet" href="fonts.css" />
<style>
  html, body { margin: 0; width: 700px; height: 800px; overflow: hidden; background: #04100b; }
  canvas { display: block; }
  .grade { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 95% at 42% 52%, transparent 45%, rgba(2, 14, 9, .62) 100%),
      linear-gradient(180deg, rgba(2, 14, 9, .35), transparent 22%); }
</style>
<script>document.documentElement.dataset.wait = 'true';</script>
<script type="importmap">{"imports": {
  "three": "/tmp/claude-0/-home-user-Slidr/47879b34-d1cb-5c54-8cd5-146df1bb4f61/scratchpad/lib/node_modules/three/build/three.module.js",
  "three/addons/": "/tmp/claude-0/-home-user-Slidr/47879b34-d1cb-5c54-8cd5-146df1bb4f61/scratchpad/lib/node_modules/three/examples/jsm/"
}}</script>
</head>
<body>
<div class="grade"></div>
<script type="module">
  import * as THREE from 'three';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { renderWithFocus } from './shvav-dof.js';
  import { buildBoard } from './shvav-board.js';

  const W = 700, H = 800;
  const params = new URLSearchParams(location.search);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(W, H);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = Number(params.get('ex') ?? 0.95);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#04100b');
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = Number(params.get('env') ?? 0.35);
  scene.environmentRotation = new THREE.Euler(0, Number(params.get('rot') ?? 0), 0);

  const { board } = await buildBoard();
  scene.add(board);

  // The bench under the board: a dark mat.
  const mat = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#0a1511', roughness: 0.85 }));
  mat.rotation.x = -Math.PI / 2;
  mat.position.y = -1.62;
  mat.receiveShadow = true;
  scene.add(mat);

  const key = new THREE.DirectionalLight('#fff4e6', Number(params.get('key') ?? 2.4));
  key.position.set(Number(params.get('kx') ?? -60), Number(params.get('ky') ?? 28), Number(params.get('kz') ?? 6));
  key.castShadow = true;
  key.shadow.mapSize.set(4096, 4096);
  key.shadow.camera.left = -40; key.shadow.camera.right = 40;
  key.shadow.camera.top = 40; key.shadow.camera.bottom = -40;
  key.shadow.bias = -0.0004;
  key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.DirectionalLight('#cfe9ff', Number(params.get('rim') ?? 0.15));
  rim.position.set(50, 20, -60);
  scene.add(rim);
  const fill = new THREE.PointLight('#ffd9a8', Number(params.get('fill') ?? 300), 0, 2);
  fill.position.set(10, 18, 30);
  scene.add(fill);

  // Aimed at the microcontroller, from low over the near corner.
  const target = new THREE.Vector3(Number(params.get('tx') ?? 0), 0.4, Number(params.get('tz') ?? -1.5));
  const camera = new THREE.PerspectiveCamera(Number(params.get('fov') ?? 30), W / H, 1, 1000);
  camera.position.set(Number(params.get('cx') ?? -12), Number(params.get('cy') ?? 15), Number(params.get('cz') ?? 27));
  camera.lookAt(target);

  renderWithFocus(renderer, scene, camera, {
    focus: camera.position.distanceTo(target),
    K: Number(params.get('k') ?? 20),
    maxR: Number(params.get('maxr') ?? 30),
    bloom: Number(params.get('bl') ?? 0.6),
    radius: 0.35,
    threshold: Number(params.get('th') ?? 3),
  });
  document.documentElement.dataset.ready = 'true';
</script>
</body>
</html>
