<script type="module">
import * as THREE from 'three';
import { renderAccumulated } from './hitech-render.js';

const W = innerWidth, H = innerHeight;
const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? Q.get(k).split(',').map(Number) : d);
await document.fonts.load('800 400px "Frank Ruhl"');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NoToneMapping;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();

let seed = 5;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(2 * Math.PI * rnd());

// the letter, as a mask
const S = 1024;
const mask = document.createElement('canvas');
mask.width = mask.height = S;
const g = mask.getContext('2d');
g.fillStyle = '#000';
g.font = `800 ${num('glyph', [860])[0]}px "Frank Ruhl"`;
g.textAlign = 'center';
g.textBaseline = 'middle';
g.fillText('א', S / 2, S * 0.53);
const data = g.getImageData(0, 0, S, S).data;
const inside = (x, y) => x >= 0 && y >= 0 && x < S && y < S && data[(Math.floor(y) * S + Math.floor(x)) * 4 + 3] > 128;

const positions = [], colors = [], sizes = [], alphas = [];
const INK = new THREE.Color(num('ink', [0x15183a])[0]);
const INDIGO = new THREE.Color(0x3a3fd6);
const AMBER = new THREE.Color(0xff7417);
function add(p, color, size, alpha) {
  positions.push(p.x, p.y, p.z);
  colors.push(color.r, color.g, color.b);
  sizes.push(size);
  alphas.push(alpha);
}
const toWorld = (x, y, z) => new THREE.Vector3((x - S / 2) / 400, -(y - S / 2) / 400, z);
const DEPTH = num('depth', [0.22])[0];

// the body: points through the thickness of the letter, denser and darker at its edges
const want = num('points', [90000])[0];
let made = 0, tries = 0;
while (made < want && tries < want * 40) {
  tries++;
  const x = rnd() * S, y = rnd() * S;
  if (!inside(x, y)) continue;
  const edge = !inside(x + 7, y) || !inside(x - 7, y) || !inside(x, y + 7) || !inside(x, y - 7);
  if (!edge && rnd() < 0.35) continue;
  // the edges make the walls of the letter, the rest lies mostly on its face
  const z = edge ? (rnd() - 0.5) * DEPTH : rnd() < 0.6 ? DEPTH / 2 - rnd() * 0.02 : (rnd() - 0.5) * DEPTH;
  const p = toWorld(x, y, z);
  // the top of the letter comes apart: the higher, the more of it rises away as tokens
  const loose = THREE.MathUtils.smoothstep(1 - y / S, 0.56, 0.8);
  if (rnd() < loose * 0.6) {
    const t = Math.pow(rnd(), 1.5);
    p.y += t * 1.15 + 0.04;
    p.x += gauss() * 0.22 * t + t * 0.12;
    p.z += gauss() * 0.3 * t;
    add(p, AMBER, 1.1 + rnd() * 1.7 * (1 - t), 0.9 - t * 0.6);
    made++;
    continue;
  }
  const tint = INK.clone().lerp(INDIGO, rnd() * 0.45);
  add(p, edge ? INK : tint, edge ? 1.25 : 1.0, edge ? 0.75 : 0.32);
  made++;
}
// a few amber sparks inside the letter, where it is thinking
for (let i = 0; i < 900; i++) {
  const x = rnd() * S, y = rnd() * S;
  if (!inside(x, y)) continue;
  add(toWorld(x, y, (rnd() - 0.5) * DEPTH), AMBER, 1.6 + rnd() * 1.4, 0.7);
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
geo.setAttribute('alpha', new THREE.Float32BufferAttribute(alphas, 1));
const scale = num('dot', [2.2])[0] * devicePixelRatio;
const mat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { scale: { value: scale } },
  vertexShader: `attribute float size; attribute float alpha; attribute vec3 color; uniform float scale;
    varying vec3 vColor; varying float vAlpha;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vColor = color;
      vAlpha = alpha;
      gl_PointSize = size * scale * (4.6 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `varying vec3 vColor; varying float vAlpha;
    void main() { vec2 c = gl_PointCoord - 0.5; float d = length(c); if (d > 0.5) discard;
      gl_FragColor = vec4(vColor, vAlpha * smoothstep(0.5, 0.15, d)); }`,
});
const cloud = new THREE.Points(geo, mat);
cloud.rotation.set(...num('rot', [0.1, 0.42, -0.02]));
cloud.position.set(...num('pos', [0, -0.35, 0]));
scene.add(cloud);

const camera = new THREE.PerspectiveCamera(num('fov', [30])[0], W / H, 0.1, 100);
camera.position.set(0, 0, num('dist', [4.6])[0]);
camera.lookAt(0, 0, 0);

await renderAccumulated(renderer, scene, camera, {
  frames: num('frames', [24])[0],
  focus: new THREE.Vector3(0, 0, num('focus', [0.2])[0]),
  aperture: num('ap', [0.05])[0],
});
document.documentElement.dataset.ready = 'true';
</script>
