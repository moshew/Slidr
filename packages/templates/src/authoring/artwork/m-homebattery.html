<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The picture of m-homebattery: a wall-mounted home battery with a charge light bar, its
     shadow on a transparent wall. node tools/render-art.mjs m-homebattery.html out.png 800 1040 2 -->
    <link rel="stylesheet" href="fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 800px;
        height: 1040px;
        overflow: hidden;
        background: transparent;
      }
    </style>
    <script>
      document.documentElement.dataset.wait = 'true';
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "/tmp/claude-0/-home-user-Slidr/47879b34-d1cb-5c54-8cd5-146df1bb4f61/scratchpad/lib/node_modules/three/build/three.module.js",
          "three/addons/": "/tmp/claude-0/-home-user-Slidr/47879b34-d1cb-5c54-8cd5-146df1bb4f61/scratchpad/lib/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import {
        THREE,
        studio,
        softboxes,
        shadowGround,
        canvasTexture,
        grain,
        brushed,
        anchors,
        loadFont,
        done,
      } from './techproduct-studio.js';
      import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

      await loadFont(
        'Inter',
        '@fontsource-variable/inter/files/inter-latin-wght-normal.woff2',
        '100 900',
      );
      const W = 800,
        H = 1040;
      const { renderer, scene, camera } = studio({
        width: W,
        height: H,
        fov: 24,
        exposure: 1.24,
        tone: 'neutral',
      });
      scene.environment = softboxes(renderer, {
        top: '#3c4150',
        horizon: '#232733',
        bottom: '#0b0d12',
        power: 1.0,
        panels: [
          { at: [-6, 5, 7], size: [4, 5], power: 2.0, color: '#f6f6f4' },
          { at: [-8, 1, -1], size: [3, 7], power: 2.2, color: '#e8eefc' },
          { at: [7, 2, 1], size: [1.2, 7], power: 2.0, color: '#ffe2bd' },
          { at: [0, 9, 2], size: [6, 2], power: 1.4 },
        ],
      });

      camera.position.set(-1.55, 0.32, 3.55);
      camera.lookAt(-0.02, -0.01, 0);

      RectAreaLightUniformsLib.init();
      const area = new THREE.RectAreaLight('#fff6ea', 9, 1.0, 1.2);
      area.position.set(-1.5, 1.6, 1.3);
      area.lookAt(0, -0.1, 0);
      scene.add(area);
      const key = new THREE.DirectionalLight('#fff8ef', 0.8);
      key.position.set(-3, 4, 4);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -2;
      key.shadow.camera.right = 2;
      key.shadow.camera.top = 2;
      key.shadow.camera.bottom = -2;
      key.shadow.radius = 14;
      key.shadow.bias = -0.0004;
      key.shadow.normalBias = 0.01;
      scene.add(key);
      const rim = new THREE.DirectionalLight('#cfdcff', 0.9);
      rim.position.set(3, 2, -1.5);
      scene.add(rim);
      const side = new THREE.DirectionalLight('#ffffff', 0.7);
      side.position.set(-5, 1, 0.5);
      scene.add(side);

      const UW = 0.62,
        UH = 1.12,
        UD = 0.15;
      const unit = new THREE.Group();
      scene.add(unit);

      // The chassis: anodised aluminium in graphite, brushed along its height.
      const brush = brushed(1024, { base: 140, spread: 60, seed: 9 });
      brush.rotation = Math.PI / 2;
      brush.center.set(0.5, 0.5);
      const chassis = new THREE.Mesh(
        new RoundedBoxGeometry(UW - 0.03, UH - 0.03, UD - 0.05, 10, 0.03),
        new THREE.MeshPhysicalMaterial({
          color: '#6a6e76',
          metalness: 0.8,
          roughness: 0.34,
          roughnessMap: brush,
          clearcoat: 0.2,
          clearcoatRoughness: 0.3,
        }),
      );
      chassis.position.z = -0.025;
      chassis.castShadow = true;
      unit.add(chassis);

      // The front cover: matte warm white with a fine grain, and the name debossed near the top.
      const rough = grain(512, { base: 150, spread: 28, seed: 4 });
      const name = canvasTexture(1024, 256, (ctx, w, h) => {
        ctx.font = '600 112px "Inter"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.letterSpacing = '46px';
        ctx.fillText('DUSK', w / 2 + 23, h / 2);
      });
      const cover = new THREE.Mesh(
        new RoundedBoxGeometry(UW, UH, 0.07, 12, 0.032),
        new THREE.MeshPhysicalMaterial({
          color: '#f1f0ec',
          roughness: 0.5,
          roughnessMap: rough,
          clearcoat: 0.3,
          clearcoatRoughness: 0.35,
          sheen: 0.2,
          sheenColor: '#ffffff',
        }),
      );
      cover.position.z = UD / 2 - 0.035;
      cover.castShadow = true;
      cover.receiveShadow = true;
      unit.add(cover);
      // The name, printed in a soft grey near the top, and the seam of the service panel near the bottom.
      const label = new THREE.Mesh(
        new THREE.PlaneGeometry(0.16, 0.04),
        new THREE.MeshStandardMaterial({
          color: '#8d8b86',
          alphaMap: name,
          transparent: true,
          roughness: 0.6,
        }),
      );
      label.position.set(0, UH / 2 - 0.12, UD / 2 + 0.0002);
      unit.add(label);
      const seam = new THREE.Mesh(
        new THREE.BoxGeometry(UW - 0.064, 0.003, 0.004),
        new THREE.MeshStandardMaterial({ color: '#9a9892', roughness: 0.7 }),
      );
      seam.position.set(0, -UH / 2 + 0.1, UD / 2 - 0.0016);
      unit.add(seam);

      // The light bar: a slot in the cover, lit in amber up to the charge, dark above it.
      const slotH = 0.62,
        slotW = 0.016,
        charge = 0.82;
      const slotY = -0.08;
      const slot = new THREE.Mesh(
        new RoundedBoxGeometry(slotW + 0.012, slotH + 0.012, 0.01, 4, 0.006),
        new THREE.MeshStandardMaterial({ color: '#1b1c20', roughness: 0.5 }),
      );
      slot.position.set(0, slotY, UD / 2 + 0.006);
      unit.add(slot);
      const lit = new THREE.Mesh(
        new THREE.CapsuleGeometry(slotW / 2, slotH * charge - slotW, 8, 24),
        new THREE.MeshStandardMaterial({
          color: '#000000',
          emissive: '#ff8a24',
          emissiveIntensity: 1.15,
          toneMapped: false,
        }),
      );
      const core = new THREE.Mesh(
        new THREE.CapsuleGeometry(slotW / 4.5, slotH * charge - slotW, 8, 24),
        new THREE.MeshStandardMaterial({
          color: '#000000',
          emissive: '#ffc078',
          emissiveIntensity: 1.25,
          toneMapped: false,
        }),
      );
      lit.position.set(0, slotY - slotH / 2 + (slotH * charge) / 2, UD / 2 + 0.011);
      unit.add(lit);
      core.position.copy(lit.position);
      core.position.z += slotW / 2 - slotW / 4.5 + 0.0005;
      unit.add(core);
      const unlit = new THREE.Mesh(
        new THREE.CapsuleGeometry(slotW / 2, slotH * (1 - charge) - slotW - 0.012, 8, 24),
        new THREE.MeshStandardMaterial({
          color: '#3a3328',
          emissive: '#5a3a14',
          emissiveIntensity: 0.4,
          roughness: 0.4,
        }),
      );
      unlit.position.set(0, slotY + slotH / 2 - (slotH * (1 - charge)) / 2, UD / 2 + 0.011);
      unit.add(unlit);

      // A soft halo where the bar meets the cover.
      const halo = new THREE.Mesh(
        new THREE.PlaneGeometry(0.2, slotH * charge + 0.12),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader:
            'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
          fragmentShader:
            'varying vec2 vUv; void main(){ float x = abs(vUv.x - 0.5) * 2.0; float y = abs(vUv.y - 0.5) * 2.0; float a = exp(-x * x * 7.0) * (1.0 - smoothstep(0.8, 1.0, y)); gl_FragColor = vec4(vec3(1.0, 0.55, 0.16) * a * 0.32, a * 0.32); }',
        }),
      );
      halo.position.set(0, slotY - slotH / 2 + (slotH * charge) / 2, UD / 2 + 0.0075);
      unit.add(halo);

      // Status: four small dots under the bar.
      for (let i = 0; i < 4; i++) {
        const dot = new THREE.Mesh(
          new THREE.CircleGeometry(0.0045, 24),
          new THREE.MeshStandardMaterial({
            color: i < 3 ? '#000000' : '#5a5650',
            emissive: i < 3 ? '#ff9a3a' : '#000000',
            emissiveIntensity: 1.2,
            toneMapped: i >= 3,
          }),
        );
        dot.position.set(-0.03 + i * 0.02, slotY - slotH / 2 - 0.04, UD / 2 + 0.0002);
        unit.add(dot);
      }

      // The wall behind: only the shadow of the unit shows on it.
      const wall = shadowGround({
        opacity: 0.6,
        center: [0.08, -0.05],
        fade: [0.55, 1.05],
        vertical: true,
        size: 6,
      });
      wall.position.z = -UD / 2 - 0.035;
      scene.add(wall);

      renderer.render(scene, camera);
      anchors(camera, W, H, {
        center: [0, 0, UD / 2],
        top: [0, UH / 2, UD / 2],
        bottom: [0, -UH / 2, UD / 2],
        barTop: [0, slotY + slotH / 2, UD / 2],
        barLevel: [0, slotY - slotH / 2 + slotH * charge, UD / 2],
        barBottom: [0, slotY - slotH / 2, UD / 2],
        leftEdge: [-UW / 2, 0, UD / 2],
        rightBack: [UW / 2, 0, -UD / 2],
      });
      done();
    </script>
  </body>
</html>
