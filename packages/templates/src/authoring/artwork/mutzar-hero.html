<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>

  html, body { margin: 0; width: 1728px; height: 568px; overflow: hidden; }
  body { font-family: Inter, Assistant, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; position: relative;

      radial-gradient(40% 90% at 12% 80%, rgba(244,81,47,.22), transparent 70%),
      radial-gradient(40% 90% at 90% 70%, rgba(111,94,240,.18), transparent 70%),
      linear-gradient(90deg, #fbe7dd, #f6f1ea 50%, #ece8fa); }
  [dir=rtl] body { font-family: Assistant, Inter, sans-serif; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(24,23,29,.13) 1.2px, transparent 1.5px); background-size: 26px 26px; -webkit-mask: radial-gradient(60% 90% at 50% 40%, #000, transparent 85%); mask: radial-gradient(60% 90% at 50% 40%, #000, transparent 85%); }
  .stage { position: absolute; inset: 0; perspective: 2300px; perspective-origin: 50% 0%; }

  [dir=rtl] .win { transform: rotateX(24deg) rotateZ(4deg); }

  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .url { position: absolute; left: 50%; transform: translateX(-50%); background: #f6f4ef; border-radius: 999px; padding: 5px 60px; font-size: 13px; color: var(--muted); }
  .app { display: flex; height: calc(100% - 47px); }
  .side { width: 210px; border-inline-end: 1px solid var(--line); padding: 18px 14px; box-sizing: border-box; background: #fcfbf9; }

  .nav .n { margin-inline-start: auto; background: var(--coral); color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
  .main { flex: 1; padding: 22px 26px; box-sizing: border-box; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }

  .search kbd { margin-inline-start: auto; font: 600 11px Inter; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; background: #f6f4ef; }
  .new { background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 10px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .kpi .l { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }

  .row { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; }

  .wf .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-inline-start: auto; }
  [dir=rtl] .chip { font-size: 12px; }
  .runs { width: 54px; text-align: end; color: var(--muted); font-size: 12px; }
  .float { position: absolute; background: #fff; border-radius: 18px; border: 1px solid rgba(24,23,29,.06); box-shadow: 0 2px 4px rgba(59,36,20,.05), 0 24px 50px rgba(59,36,20,.16); }
  .appr { left: 92px; top: 236px; width: 318px; padding: 16px 18px; transform: rotate(-3deg); }
  [dir=rtl] .appr { left: auto; right: 92px; transform: rotate(3deg); }

  [dir=rtl] .appr .t { font-size: 13.5px; letter-spacing: 0; color: #c98317; }
  .appr .who { display: flex; align-items: center; gap: 10px; margin: 12px 0 14px; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }

  [dir=rtl] .appr .who b { font-size: 16.5px; }

  .agent { right: 76px; top: 262px; width: 336px; padding: 16px 18px; transform: rotate(2.5deg); }

  .toast { right: 236px; top: 46px; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; border-radius: 14px; font-size: 14px; font-weight: 600; transform: rotate(1.5deg); }
  [dir=rtl] .toast { right: auto; left: 236px; padding: 12px 12px 12px 16px; font-size: 15.5px; transform: rotate(-1.5deg); }
  .ok { width: 30px; height: 30px; border-radius: 50%; background: var(--mint); display: grid; place-items: center; }
  .kchip { left: 236px; top: 74px; padding: 12px 16px; border-radius: 14px; transform: rotate(-2deg); }
  [dir=rtl] .kchip { left: auto; right: 236px; transform: rotate(2deg); }
  .kchip .l { font-size: 12px; color: var(--muted); }
  [dir=rtl] .kchip .l { font-size: 13.5px; }
  .kchip .v { font-family: 'DM Sans', Rubik, sans-serif; font-size: 26px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
  .kchip .v span { font-family: Inter; font-size: 12.5px; font-weight: 700; color: var(--mint); }
  .cur { position: absolute; }
  .cur span { position: absolute; top: 22px; inset-inline-start: 16px; color: #fff; font-size: 13px; font-weight: 600; padding: 4px 9px; border-radius: 8px; white-space: nowrap; }
  [dir=rtl] .cur svg { transform: scaleX(-1); }
</style>
</head>
<body>

<div class="stage"><div class="win" id="win"></div></div>
<div id="floats"></div>
<script>
  const he = location.search.includes('lang=he');
  document.documentElement.dir = he ? 'rtl' : 'ltr';
  const L = (en, h) => (he ? h : en);
  const I = {

    flow: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><path d="M10 6.5h3.5a3 3 0 0 1 3 3V14"/>',
    inbox: '<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/>',

    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',

    box: '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    alert: '<path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>',
    spark: '<path d="M11 3.5l1.8 4.9 4.9 1.8-4.9 1.8L11 16.9l-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="M18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',

  const ic = (n, c, s = 16, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
  const mark = `<svg width="15" height="15" viewBox="0 0 40 40"><circle cx="12" cy="13" r="5" fill="#fff"/><circle cx="28" cy="27" r="5" fill="#fff"/><path d="M16 13h4.5c4 0 4 14 8 14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;

  // The bars of orders by hour: a working day, a peak at noon, and the hour now.

  const flows = [
    ['box', '#12a073', L('Order intake', 'קליטת הזמנות'), L('Running', 'פועל'), 'rgba(18,160,115,.12)', '#12a073', '1,284'],
    ['truck', '#f4512f', L('Delivery updates', 'עדכוני משלוח'), L('Running', 'פועל'), 'rgba(18,160,115,.12)', '#12a073', '912'],
    ['spark', '#6f5ef0', L('Supplier reorders', 'הזמנות מספקים'), L('AI agent', 'סוכן AI'), 'rgba(111,94,240,.12)', '#6f5ef0', '48'],
    ['bill', '#c98317', L('Invoice matching', 'התאמת חשבוניות'), L('Running', 'פועל'), 'rgba(18,160,115,.12)', '#12a073', '366'],
    ['send', '#18171d', L('Weekly report', 'דוח שבועי'), L('Scheduled', 'מתוזמן'), 'rgba(24,23,29,.07)', '#6e6b75', '1'],
  ];
  document.getElementById('win').innerHTML = `

    <div class="app">
      <div class="side">
        <div class="brand"><b>${mark}</b>Zrima</div>
        ${[['home', L('Home', 'בית'), 1], ['flow', L('Workflows', 'תהליכים')], ['inbox', L('Inbox', 'תיבת הודעות'), 0, 3], ['chart', L('Insights', 'תובנות')], ['plug', L('Integrations', 'חיבורים')], ['users', L('Team', 'צוות')]]

        <div class="head"><h1>${L('Good evening, Noa', 'ערב טוב, נועה')}</h1><span class="date">${L('Tuesday, 8 December', 'יום שלישי, 8 בדצמבר')}</span>

        <div class="kpis">

          <div class="card"><h3>${L('Live workflows', 'תהליכים פעילים')}</h3>
            ${flows.map(([n, c, name, st, bg, fg, runs]) => `<div class="wf"><div class="ic" style="background:${c}1f">${ic(n, c, 15)}</div>${name}<span class="chip" style="background:${bg};color:${fg}">${st}</span><span class="runs">${runs}</span></div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
  const cursor = (x, y, color, name, side) => `<div class="cur" style="${side}:${x}px;top:${y}px"><svg width="22" height="27" viewBox="0 0 24 30"><path d="M2 2v24l6.5-6.2 4.3 9.7 4.3-1.9-4.3-9.5H21z" fill="${color}" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg><span style="background:${color}">${name}</span></div>`;
  const side = he ? 'right' : 'left';
  const other = he ? 'left' : 'right';
  document.getElementById('floats').innerHTML = `
    <div class="float kchip"><div class="l">${L('On-time delivery', 'משלוחים בזמן')}</div><div class="v">98.2%<span>▲ 4.1</span></div></div>
    <div class="float appr"><div class="t">${ic('clock', he ? '#c98317' : '#ffb547', 15, 2.4)}${L('Approval needed', 'ממתין לאישור')}</div>
      <div class="who"><div class="av" style="background:#ffb547;color:#18171d">${L('S', 'ס')}</div><div><b>${L('Supplier order #4821', 'הזמנה מספק #4821')}</b><span>${L('$4,960 · 3 items · Drafted by AI', '₪ 18,400 · 3 פריטים · טיוטת AI')}</span></div></div>
      <div class="btns"><div style="background:#18171d;color:#fff">${L('Approve', 'אישור')}</div><div style="border:1px solid rgba(24,23,29,.12)">${L('Review', 'בדיקה')}</div></div></div>
    <div class="float agent"><div class="t">${ic('spark', '#6f5ef0', 17, 2.2)}${L('AI agent · tonight', 'סוכן AI · הלילה')}</div>

</script>
