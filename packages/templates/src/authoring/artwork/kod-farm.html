<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 596px;
        overflow: hidden;
        background: #0d0e14;
      }
      body {
        font-family: 'JetBrains Mono', monospace;
        color: #e9e7f3;
        perspective: 1500px;
        perspective-origin: 70% 40%;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 90% at 78% 30%, rgba(126, 231, 135, 0.16), transparent 60%),
          radial-gradient(50% 80% at 20% 80%, rgba(195, 166, 255, 0.14), transparent 65%);
      }
      .board {
        position: absolute;
        left: 170px;
        top: 26px;
        width: 1900px;
        height: 700px;
        transform: rotateY(-24deg) rotateX(8deg) rotateZ(-1.5deg);
        transform-origin: 0 50%;
        background: linear-gradient(180deg, #1a1c29, #14151f);
        border: 1px solid #2c2f44;
        border-radius: 22px;
        box-shadow:
          0 60px 120px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      }
      .head {
        height: 70px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 30px;
        border-bottom: 1px solid #2c2f44;
        font-size: 20px;
        color: #a3a1ba;
      }
      .head b {
        color: #e9e7f3;
        font-weight: 600;
      }
      .pill {
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 16px;
      }
      .rows {
        position: relative;
        padding: 14px 30px;
      }
      .row {
        height: 46px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .name {
        width: 170px;
        font-size: 17px;
        color: #a3a1ba;
      }
      .lane {
        position: relative;
        flex: 1;
        height: 26px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.035);
      }
      .job {
        position: absolute;
        top: 0;
        height: 26px;
        border-radius: 6px;
      }
      .now {
        position: absolute;
        top: 80px;
        bottom: 10px;
        width: 2px;
        background: #ffb86b;
        box-shadow: 0 0 16px #ffb86b;
      }
      .fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(13, 14, 20, 0) 55%, rgba(13, 14, 20, 0.75) 100%);
        pointer-events: none;
      }
      .blur {
        position: absolute;
        right: 0;
        top: 0;
        width: 520px;
        height: 100%;
        backdrop-filter: blur(3px);
        -webkit-mask: linear-gradient(90deg, transparent, #000 70%);
        mask: linear-gradient(90deg, transparent, #000 70%);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="board">
      <div class="head">
        <b>build-farm</b><span>12 runners</span>
        <span class="pill" style="background: rgba(126, 231, 135, 0.15); color: #7ee787"
          >● 12 online</span
        >
        <span class="pill" style="background: rgba(255, 184, 107, 0.14); color: #ffb86b"
          >queue 0</span
        >
        <span style="margin-left: auto">cache hit 91%</span><span>avg 4m 02s</span>
      </div>
      <div class="rows" id="rows"></div>
      <div class="now" style="left: 1330px"></div>
    </div>
    <div class="fade"></div>
    <div class="blur"></div>
    <script>
      const colors = {
        checkout: '#82aaff',
        cache: '#c3a6ff',
        build: '#7ee787',
        test: '#ffb86b',
        preview: '#ff7ab6',
      };
      let seed = 11;
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
      const rows = document.getElementById('rows');
      for (let r = 0; r < 12; r++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<div class="name">runner-${String(r + 1).padStart(2, '0')}</div><div class="lane"></div>`;
        const lane = row.querySelector('.lane');
        let x = rnd() * 60;
        while (x < 1560) {
          for (const [stage, w] of [
            ['checkout', 14],
            ['cache', 10],
            ['build', 90 + rnd() * 120],
            ['test', 60 + rnd() * 110],
            ['preview', 26],
          ]) {
            if (x > 1560) break;
            const job = document.createElement('div');
            job.className = 'job';
            job.style.left = x + 'px';
            job.style.width = Math.min(w, 1600 - x) + 'px';
            job.style.background = colors[stage];
            job.style.opacity = x > 1150 ? 0.55 : 0.9;
            lane.append(job);
            x += w + 3;
          }
          x += 18 + rnd() * 70;
        }
        rows.append(row);
      }
    </script>
  </body>
</html>
