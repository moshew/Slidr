<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- The picture of m-bugbounty: a jewel beetle, emerald with copper edges, seen from above at
     three quarters, on a transparent ground.
     node <scratchpad>/hitech/render.mjs m-bugbounty.html out.png 1000 1000 2 -->
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
    <script>
      document.documentElement.dataset.wait = 'true';
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "/tmp/claude-0/-home-user-Slidr/47879b34-d1cb-5c54-8cd5-146df1bb4f61/scratchpad/lib/node_modules/three/build/three.module.js",
          "three/addons/": "/tmp/claude-0/-home-user-Slidr/47879b34-d1cb-5c54-8cd5-146df1bb4f61/scratchpad/lib/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { renderAccumulated } from './hitech-render.js';

      const W = innerWidth,
        H = innerHeight;
      const Q = new URLSearchParams(location.search);
      const num = (k, d) => (Q.has(k) ? Q.get(k).split(',').map(Number) : d);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(W, H);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = num('exp', [1.0])[0];
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      document.body.append(renderer.domElement);

      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;
      scene.environmentIntensity = num('env', [0.75])[0];

      const EMERALD = new THREE.Color(num('green', [0x12b85a])[0]);
      const COPPER = new THREE.Color(num('copper', [0xe2622a])[0]);

      // grooves along the wing covers: a bump map over u, which runs from seam to seam around each cover
      function striae(n) {
        const c = document.createElement('canvas');
        c.width = 2048;
        c.height = 8;
        const g = c.getContext('2d');
        g.fillStyle = '#fff';
        g.fillRect(0, 0, 2048, 8);
        for (let i = 0; i < n; i++) {
          const x = (i + 0.5) * (2048 / n);
          const grad = g.createLinearGradient(x - 14, 0, x + 14, 0);
          grad.addColorStop(0, '#fff');
          grad.addColorStop(0.5, '#3a3a3a');
          grad.addColorStop(1, '#fff');
          g.fillStyle = grad;
          g.fillRect(x - 14, 0, 28, 8);
        }
        return new THREE.CanvasTexture(c);
      }

      const look = {
        metalness: 1,
        roughness: 0.24,
        iridescence: num('iri', [0.55])[0],
        iridescenceIOR: 1.45,
        iridescenceThicknessRange: [280, 560],
        clearcoat: 1,
        clearcoatRoughness: 0.08,
        vertexColors: true,
      };
      const shell = new THREE.MeshPhysicalMaterial({
        ...look,
        bumpMap: striae(22),
        bumpScale: 0.9,
        side: THREE.DoubleSide,
      });
      const plate = new THREE.MeshPhysicalMaterial({ ...look, roughness: 0.2 });
      const dark = new THREE.MeshPhysicalMaterial({
        color: 0x0d3a26,
        metalness: 1,
        roughness: 0.32,
        iridescence: 0.5,
        iridescenceIOR: 1.4,
        clearcoat: 0.8,
        clearcoatRoughness: 0.2,
      });
      const eyeMat = new THREE.MeshPhysicalMaterial({
        color: 0x0a0a08,
        roughness: 0.1,
        clearcoat: 1,
      });

      const beetle = new THREE.Group();
      scene.add(beetle);

      /**
       * An ellipsoid of radii (a, b, c), its length along z, optionally only one side of it, with the
       * rear (-z) drawn to a point and the front squared off; copper toward the outer edge.
       */
      function ellipsoid(
        a,
        b,
        c,
        { side = 0, taper = 0, square = 0, edge = 0.72, segs = 120 } = {},
      ) {
        const geo = side
          ? new THREE.SphereGeometry(1, segs, 80, side > 0 ? Math.PI / 2 : -Math.PI / 2, Math.PI)
          : new THREE.SphereGeometry(1, segs, 80);
        geo.rotateX(Math.PI / 2);
        const p = geo.attributes.position;
        const colors = [];
        for (let i = 0; i < p.count; i++) {
          let x = p.getX(i),
            y = p.getY(i),
            z = p.getZ(i);
          const back = Math.max(0, -z),
            front = Math.max(0, z);
          const lateral = Math.abs(x);
          x *= a * (1 - taper * Math.pow(back, 2.2)) * (1 + square * front * front * 0.25);
          y *= b * (y < 0 ? 0.45 : 1) * (1 - 0.35 * Math.pow(back, 3));
          z *= c;
          p.setXYZ(i, x, y, z);
          const t = THREE.MathUtils.smoothstep(lateral, edge, 0.98);
          const col = EMERALD.clone().lerp(COPPER, t);
          colors.push(col.r, col.g, col.b);
        }
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.computeVertexNormals();
        return geo;
      }

      // the abdomen, under the wing covers
      const belly = new THREE.Mesh(ellipsoid(0.82, 0.4, 1.9, { taper: 0.5 }), dark);
      belly.position.set(0, 0.05, -0.15);
      beetle.add(belly);
      // the wing covers, long and pointed, split down the middle
      for (const s of [1, -1]) {
        const m = new THREE.Mesh(
          ellipsoid(0.86, 0.6, 2.05, { side: s, taper: 0.62, edge: 0.6 }),
          shell,
        );
        m.position.set(s * 0.012, 0.08, -0.35);
        m.castShadow = m.receiveShadow = true;
        beetle.add(m);
      }
      // the shield behind the head, wide at its back, flush with the covers
      const pronotum = new THREE.Mesh(ellipsoid(0.84, 0.38, 0.6, { square: 0, edge: 0.66 }), plate);
      pronotum.position.set(0, 0.12, 1.72);
      pronotum.scale.set(1, 1, 1);
      pronotum.castShadow = pronotum.receiveShadow = true;
      beetle.add(pronotum);
      {
        // narrow the shield toward the head
        const p = pronotum.geometry.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const z = p.getZ(i) / 0.62;
          p.setX(i, p.getX(i) * (1 - 0.18 * Math.max(0, z)));
        }
        pronotum.geometry.computeVertexNormals();
      }
      // the head, half sunk in the shield
      const head = new THREE.Mesh(ellipsoid(0.38, 0.26, 0.32, { edge: 0.8 }), plate);
      head.position.set(0, 0.02, 2.26);
      head.castShadow = true;
      beetle.add(head);
      for (const s of [1, -1]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 16), eyeMat);
        eye.scale.set(0.8, 1, 1.2);
        eye.position.set(s * 0.3, 0.08, 2.3);
        beetle.add(eye);
        // short, saw-toothed antennae
        const ant = new THREE.CatmullRomCurve3([
          new THREE.Vector3(s * 0.22, 0.12, 2.6),
          new THREE.Vector3(s * 0.38, 0.2, 2.95),
          new THREE.Vector3(s * 0.62, 0.22, 3.25),
          new THREE.Vector3(s * 0.84, 0.18, 3.45),
        ]);
        const antenna = new THREE.Mesh(new THREE.TubeGeometry(ant, 40, 0.028, 8), dark);
        antenna.castShadow = true;
        beetle.add(antenna);
        for (let k = 0; k < 7; k++) {
          const seg = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.11, 10), dark);
          const tt = 0.25 + k * 0.11;
          seg.position.copy(ant.getPoint(tt));
          seg.lookAt(ant.getPoint(Math.min(1, tt + 0.05)));
          seg.rotateX(Math.PI / 2);
          beetle.add(seg);
        }
        // legs, short, mostly under the body: femur, tibia and foot
        const legs = [
          {
            root: [0.5, -0.05, 1.45],
            knee: [0.98, 0.08, 1.85],
            ankle: [1.22, -0.36, 2.35],
            toe: [1.32, -0.48, 2.7],
          },
          {
            root: [0.6, -0.1, 0.5],
            knee: [1.16, 0.06, 0.62],
            ankle: [1.5, -0.36, 0.48],
            toe: [1.78, -0.48, 0.36],
          },
          {
            root: [0.56, -0.1, -0.35],
            knee: [1.1, 0.04, -0.7],
            ankle: [1.36, -0.36, -1.35],
            toe: [1.46, -0.48, -1.82],
          },
        ];
        for (const leg of legs) {
          const v = (a) => new THREE.Vector3(s * a[0], a[1], a[2]);
          const parts = [
            [v(leg.root), v(leg.knee), 0.085],
            [v(leg.knee), v(leg.ankle), 0.06],
            [v(leg.ankle), v(leg.toe), 0.035],
          ];
          for (const [a, b, r] of parts) {
            const mid = a
              .clone()
              .lerp(b, 0.5)
              .add(new THREE.Vector3(0, 0.03, 0));
            const m = new THREE.Mesh(
              new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a, mid, b), 16, r, 12),
              dark,
            );
            m.castShadow = true;
            beetle.add(m);
            const joint = new THREE.Mesh(new THREE.SphereGeometry(r * 1.05, 16, 12), dark);
            joint.position.copy(b);
            beetle.add(joint);
          }
        }
      }
      beetle.position.y = 0.5;
      beetle.rotation.y = num('rot', [2.6])[0];

      // --- ground and light ---------------------------------------------------------------------------
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.ShadowMaterial({ opacity: num('shadow', [0.6])[0], color: 0x000000 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const key = new THREE.DirectionalLight(0xffffff, num('key', [2.6])[0]);
      key.position.set(...num('light', [-3, 12, 4]));
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, {
        left: -6,
        right: 6,
        top: 6,
        bottom: -6,
        near: 1,
        far: 40,
      });
      key.shadow.camera.updateProjectionMatrix();
      key.shadow.bias = -0.0005;
      scene.add(key);
      const lime = new THREE.DirectionalLight(0xd4ff5a, num('lime', [1.6])[0]);
      lime.position.set(-8, 3, -3);
      const cool = new THREE.DirectionalLight(0x8fb4ff, num('cool', [1.4])[0]);
      cool.position.set(8, 4, -5);
      const front = new THREE.DirectionalLight(0xfff0dc, 0.7);
      front.position.set(2, 5, 10);
      scene.add(lime, cool, front);

      const camera = new THREE.PerspectiveCamera(num('fov', [28])[0], W / H, 0.1, 100);
      camera.position.set(...num('cam', [3.5, 11.5, 7.5]));
      camera.lookAt(...num('look', [0.2, 0.3, 0.05]));

      await renderAccumulated(renderer, scene, camera, {
        frames: num('frames', [28])[0],
        focus: new THREE.Vector3(...num('focus', [0, 1, 0.5])),
        aperture: num('ap', [0.1])[0],
        lights: [key],
        lightRadius: num('lr', [1.6])[0],
      });
      document.documentElement.dataset.ready = 'true';
    </script>
  </body>
</html>
