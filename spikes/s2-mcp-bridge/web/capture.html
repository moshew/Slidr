<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>S3 hidden capture surface</title>
    <style>
      html, body { margin: 0; background: #000; font-family: 'Segoe UI', sans-serif; }
      #slide { width: 1920px; height: 1080px; background: linear-gradient(135deg, #064e3b, #10b981 60%, #fde68a); color: #fff; position: relative; overflow: hidden; }
      #slide h1 { position: absolute; inset-inline-start: 96px; top: 120px; margin: 0; font-size: 140px; font-weight: 800; }
      #slide .card { position: absolute; inset-inline-end: 96px; bottom: 96px; width: 700px; height: 360px; border-radius: 32px; background: #fff; color: #064e3b; box-shadow: 0 30px 80px rgb(0 0 0 / 0.45); display: grid; place-items: center; font-size: 96px; font-weight: 800; direction: ltr; }
    </style>
  </head>
  <body>
    <div id="slide">
      <h1>חלון נסתר</h1>
      <div class="card">HIDDEN-3306</div>
    </div>
  </body>
</html>
