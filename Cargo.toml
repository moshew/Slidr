[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri"]
# Feasibility spikes are standalone crates with their own lockfile and lints.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
