[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri"]
# Feasibility spikes are standalone crates with their own lockfile and lints.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"

[workspace.lints.rust]
# `deny`, not `forbid`: the slide capture and the import window's network block call WebView2
# over COM, and the list of system fonts calls DirectWrite, which takes `unsafe`. Their three
# submodules carry an explicit `#[allow(unsafe_code)]` (ADR-003, "מחיר"; ADR-036; ADR-060);
# nothing else may.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
