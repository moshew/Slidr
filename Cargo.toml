[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri"]
# Feasibility spikes are standalone crates with their own lockfile and lints.
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"

[workspace.lints.rust]
# `deny`, not `forbid`: the slide capture calls WebView2 over COM, which takes `unsafe`. Its one
# submodule carries an explicit `#[allow(unsafe_code)]` (ADR-003, "מחיר"); nothing else may.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
